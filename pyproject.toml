[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sai-humanizer"
version = "0.2.0"
description = "Three-layer de-AI text humanizer: stylistic pattern removal, Unicode watermark stripping, and statistical AI detection."
readme = "README.md"

requires-python = ">=3.10"
authors = [
    {name = "Sai Likhith Kanuparthi", email = "sailikhithcse@gmail.com"}
]
keywords = [
    "ai-detection",
    "content-humanizer",
    "de-ai",
    "anti-slop",
    "writing-tools",
    "ai-writing",
    "text-rewriting",
    "burstiness",
    "watermark-removal",
    "unicode-watermarks",
    "perplexity",
    "binoculars",
    "ai-patterns",
    "chatgpt-detector",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
]
license = "MIT"

[project.optional-dependencies]
model = ["torch>=2.0", "transformers>=4.30"]
dev = ["pytest>=7.0"]

[project.scripts]
sai-humanizer = "sai_humanizer.cli:main"

[project.urls]
Homepage = "https://github.com/sailikhithk/sai-humanizer"
Repository = "https://github.com/sailikhithk/sai-humanizer"

[tool.setuptools.packages.find]
include = ["sai_humanizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
